<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#190611"><meta name="description" content="هدية عيد ميلاد خاصة لرزان من زيرو (يوسف)"><title>هدية لرزان 💖</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Great+Vibes&display=swap" rel="stylesheet"><style>
:root{--night:#150710;--hot:#ff3f9a;--rose:#ed6da9;--soft:#ffc5dd;--white:#fff7fb;--glass:rgba(255,235,246,.1);--line:rgba(255,225,240,.22)}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100svh;overflow:hidden;background:var(--night);color:var(--white);font-family:"Cairo",sans-serif}button{font:inherit}button:focus-visible{outline:3px solid #ffd4e7;outline-offset:5px}canvas{position:fixed;inset:0;z-index:2;pointer-events:none}.ambient{position:fixed;inset:-15%;z-index:0;background:linear-gradient(125deg,#12060f,#3c0a29,#1c0818,#4b0b2f,#160611);background-size:400% 400%;animation:bg 16s ease infinite}.ambient:after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.35) .6px,transparent .7px);background-size:31px 31px;opacity:.11}.blob{position:fixed;z-index:1;border-radius:50%;filter:blur(65px);opacity:.42;pointer-events:none}.b1{width:45vmax;height:45vmax;background:#e71979;right:-24vmax;top:-17vmax;animation:d1 14s ease-in-out infinite,hue 10s linear infinite}.b2{width:38vmax;height:38vmax;background:#ff76b2;left:-22vmax;top:35%;animation:d2 18s ease-in-out infinite,hue 13s linear infinite reverse}.b3{width:28vmax;height:28vmax;background:#a91d76;right:4%;bottom:-17vmax;animation:d3 16s ease-in-out infinite,hue 9s linear infinite}
.intro{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:calc(24px + env(safe-area-inset-top)) 22px calc(24px + env(safe-area-inset-bottom));background:radial-gradient(circle at 50% 38%,rgba(255,57,145,.16),transparent 38%);transition:opacity .8s,visibility .8s}.intro.open{opacity:0;visibility:hidden;pointer-events:none}.intro-inner{text-align:center}.gift-emoji{font-size:clamp(5rem,24vw,8.5rem);line-height:1;filter:drop-shadow(0 20px 28px rgba(255,38,133,.35));animation:gift 2.8s ease-in-out infinite}.hello{margin:1.4rem 0 2rem;font-size:clamp(1.65rem,8vw,2.5rem);font-weight:800}.primary,.heart-btn{border:1px solid rgba(255,255,255,.3);border-radius:999px;color:#fff;cursor:pointer;font-weight:800;background:linear-gradient(110deg,#d91f76,#ff5ba2,#ce1c70);background-size:200% auto;box-shadow:0 14px 42px rgba(220,27,113,.38),inset 0 1px rgba(255,255,255,.28);transition:transform .2s;animation:pulse 2s ease-in-out infinite,shine 4s linear infinite}.primary{padding:1rem 1.45rem;font-size:clamp(.98rem,4vw,1.15rem)}.primary:hover,.heart-btn:hover{transform:translateY(-3px)}.primary:active,.heart-btn:active{transform:scale(.97)}
.page{position:relative;z-index:3;display:none;opacity:0;transition:opacity .7s}.page.ready{display:block}.page.visible{opacity:1}main{width:min(100% - 26px,760px);margin:auto;padding-bottom:calc(70px + env(safe-area-inset-bottom))}.hero{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:calc(46px + env(safe-area-inset-top)) 0 44px}.birthday{margin:0;font-size:clamp(2.1rem,10vw,4.8rem);font-weight:900;line-height:1.25;text-shadow:0 9px 35px rgba(255,47,144,.3);opacity:0;transform:translateY(25px)}.visible .birthday{animation:rise .8s .25s forwards}.name{direction:ltr;margin:.05em 0 0;font-size:clamp(5rem,25vw,11rem);font-weight:900;line-height:.95;letter-spacing:.02em;background:linear-gradient(100deg,#fff 5%,#ff8fc2 30%,#ff3c98 52%,#ffd2e6 72%,#fff 92%);background-size:220% auto;color:transparent;background-clip:text;-webkit-background-clip:text;filter:drop-shadow(0 15px 30px rgba(255,48,144,.32));opacity:0;transform:scale(.72)}.visible .name{animation:pop 1s .65s cubic-bezier(.18,.9,.25,1.2) forwards,shine 4s 1.7s linear infinite}.script{direction:ltr;font:400 clamp(3rem,15vw,6.5rem)/1 "Great Vibes",cursive;color:#ffb2d2;margin:-.12em 0 .45em;transform:rotate(-4deg);opacity:0}.visible .script{animation:rise .8s 1.1s forwards}.type{max-width:650px;min-height:5.5em;margin:0;color:#ffe7f1;font-size:clamp(1rem,4.2vw,1.25rem);line-height:2;font-weight:600}.cursor{display:inline-block;width:2px;height:1.2em;margin-inline-start:4px;background:var(--hot);vertical-align:-.2em;animation:blink .65s step-end infinite}.cue{margin-top:2.4rem;color:#f0a5c6;font-size:.8rem;opacity:0}.visible .cue{animation:rise .7s 4.8s forwards}.cue i{display:block;width:1px;height:35px;margin:.65rem auto;background:linear-gradient(var(--soft),transparent)}
.glass{border:1px solid var(--line);border-radius:30px;background:linear-gradient(145deg,rgba(255,255,255,.12),rgba(255,255,255,.045));box-shadow:0 25px 70px rgba(5,0,4,.4),inset 0 1px rgba(255,255,255,.18);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}.letter-wrap{perspective:1200px;margin:1rem 0 2.2rem}.letter{position:relative;width:100%;min-height:300px;border:0;padding:0;background:transparent;color:inherit;cursor:pointer;text-align:inherit;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.2,.8,.2,1)}.letter.open{transform:rotateY(180deg)}.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:clamp(1.4rem,6vw,3rem);backface-visibility:hidden;-webkit-backface-visibility:hidden}.seal{display:grid;place-items:center;width:76px;height:76px;border-radius:50%;margin-bottom:1rem;background:linear-gradient(145deg,#ff5da5,#b90f5d);font-size:2rem;box-shadow:0 10px 30px rgba(255,38,131,.4);animation:beat 1.5s infinite}.front h2{margin:.2rem 0 .4rem;font-size:clamp(1.4rem,6vw,2rem)}.front p{margin:0;color:#f6b9d4}.back{transform:rotateY(180deg);align-items:stretch;text-align:right}.back p{margin:.4rem 0;line-height:2;color:#fff0f7;font-size:clamp(.95rem,4vw,1.12rem)}.signature{margin-top:1rem!important;color:#ffafd1!important;font-weight:800}.age{padding:clamp(1.35rem,5vw,2.5rem);text-align:center;margin-bottom:2.2rem}.age h2{margin:.15rem 0;color:#ffd0e4;font-size:clamp(1.35rem,6vw,2rem)}.date{color:#eb8db7;font-size:.8rem;letter-spacing:.18em}.counter{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:1.4rem}.unit{min-width:0;padding:1.05rem .15rem;border:1px solid rgba(255,255,255,.12);border-radius:18px;background:rgba(255,255,255,.055)}.num{direction:ltr;display:block;font-size:clamp(1.2rem,5vw,2rem);font-weight:800;color:#ffc2dc;line-height:1.2}.label{font-size:clamp(.65rem,2.8vw,.78rem);color:#efd6e1}.burst-area{text-align:center;padding:2.3rem 0 5rem}.burst-area h2{margin:0 0 .4rem;font-size:clamp(1.5rem,7vw,2.4rem)}.burst-area p{margin:0 0 1.4rem;color:#e7bfd1}.heart-btn{padding:.85rem 1.6rem}.tiny{display:block;margin-top:1.6rem;color:#ca8ca8;font-size:.75rem}.burst-heart{position:fixed;z-index:50;left:0;top:0;pointer-events:none;font-size:var(--size);color:var(--color);text-shadow:0 4px 12px rgba(255,23,126,.35);animation:burst 1.5s cubic-bezier(.1,.7,.2,1) forwards}.flash{position:fixed;inset:0;z-index:40;pointer-events:none;background:radial-gradient(circle,rgba(255,207,229,.52),transparent 55%);animation:flash .8s forwards}
@keyframes bg{50%{background-position:100% 50%}}@keyframes hue{to{filter:blur(65px) hue-rotate(360deg)}}@keyframes d1{50%{transform:translate(-12vw,14vh) scale(1.12)}}@keyframes d2{50%{transform:translate(18vw,-10vh) scale(.9)}}@keyframes d3{50%{transform:translate(-16vw,-14vh) scale(1.18)}}@keyframes gift{50%{transform:translateY(-18px) rotate(4deg)}}@keyframes pulse{50%{box-shadow:0 14px 55px rgba(255,56,148,.58),inset 0 1px rgba(255,255,255,.3)}}@keyframes rise{to{opacity:1;transform:none}}@keyframes pop{to{opacity:1;transform:scale(1)}}@keyframes shine{to{background-position:220% center}}@keyframes blink{50%{opacity:0}}@keyframes beat{50%{transform:scale(1.1)}}@keyframes burst{0%{opacity:0;transform:translate(-50%,-50%) scale(.2)}15%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) rotate(var(--r))}}@keyframes flash{to{opacity:0;transform:scale(1.4)}}
@media(max-width:560px){.counter{grid-template-columns:repeat(3,1fr)}.unit:nth-child(4){grid-column:1}.unit:nth-child(5){grid-column:2}.letter{min-height:330px}.glass{border-radius:24px}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}.birthday,.name,.script,.cue{opacity:1;transform:none}.blob{display:none}}
</style></head><body><div class="ambient" aria-hidden="true"></div><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i><canvas id="particles" aria-hidden="true"></canvas>
<section class="intro" id="intro" aria-label="هدية رزان"><div class="intro-inner"><div class="gift-emoji" aria-hidden="true">🎁</div><h1 class="hello">أهلاً يا رزان 👋</h1><button class="primary" id="openGift">🎁 هدية من زيرو (يوسف)</button></div></section>
<div class="page" id="page" aria-hidden="true" inert><main><section class="hero"><h1 class="birthday">عيد ميلاد سعيد</h1><div class="name">RAZAN</div><div class="script">Razan</div><p class="type" id="typewriter" aria-live="polite"></p><div class="cue">رسالة خاصة لكِ<i></i></div></section>
<section class="letter-wrap" aria-label="رسالة إلى رزان"><button class="letter" id="letter" aria-expanded="false" aria-label="افتحي الرسالة"><span class="face front glass"><span class="seal">💌</span><h2>رسالة صغيرة لرزان</h2><p>اضغطي هنا لفتحها</p></span><span class="face back glass"><p>كل عام وانت بخير رزان 🤍</p><p>وان شاء الله تتحقق كل احلامج وتصيرين احله دكتوره 🩺✨</p><p class="signature">— زيرو (يوسف)</p></span></button></section>
<section class="age glass"><span class="date">24 · 09 · 2009</span><h2>عمرك الجميل الآن</h2><div class="counter" aria-label="عداد العمر المباشر"><div class="unit"><span class="num" id="years">0</span><span class="label">سنة</span></div><div class="unit"><span class="num" id="months">0</span><span class="label">شهر</span></div><div class="unit"><span class="num" id="days">0</span><span class="label">يوم</span></div><div class="unit"><span class="num" id="hours">0</span><span class="label">ساعة</span></div><div class="unit"><span class="num" id="minutes">0</span><span class="label">دقيقة</span></div></div></section>
<section class="burst-area"><h2>لأن الفرح يليق بكِ 💗</h2><p>كل قلب هنا يحمل لكِ أمنية حلوة</p><button class="heart-btn" id="heartButton">نثري قلوب 💖</button><small class="tiny">صُنعت بحب من زيرو (يوسف)</small></section></main></div>
<script>
const intro=document.querySelector('#intro'),page=document.querySelector('#page'),openGift=document.querySelector('#openGift'),letter=document.querySelector('#letter'),heartButton=document.querySelector('#heartButton'),typewriter=document.querySelector('#typewriter'),message='كل عام وانتي بخير رزان 🌸 وان شاء الله تتحقق كل احلامج وتصيرين احلى دكتورة 🩺✨',reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
function hearts(x=innerWidth/2,y=innerHeight/2,count=30){const colors=['#ff3f9a','#ff89bb','#ffd0e3','#fff','#e82d83'];for(let i=0;i<count;i++){const h=document.createElement('span'),a=Math.random()*Math.PI*2,d=70+Math.random()*190;h.className='burst-heart';h.textContent=Math.random()>.25?'♥':'✦';h.style.cssText=`left:${x}px;top:${y}px;--x:${Math.cos(a)*d}px;--y:${Math.sin(a)*d}px;--r:${Math.random()*540-270}deg;--size:${14+Math.random()*25}px;--color:${colors[i%5]}`;document.body.append(h);setTimeout(()=>h.remove(),1600)}}
function type(){if(reduced){typewriter.textContent=message;return}let i=0;const tick=()=>{typewriter.innerHTML='';typewriter.append(document.createTextNode(message.slice(0,i)));const c=document.createElement('span');c.className='cursor';typewriter.append(c);if(i++<message.length)setTimeout(tick,48)};tick()}
openGift.addEventListener('click',()=>{const r=openGift.getBoundingClientRect();hearts(r.left+r.width/2,r.top+r.height/2,45);const f=document.createElement('i');f.className='flash';document.body.append(f);setTimeout(()=>f.remove(),900);page.classList.add('ready');page.removeAttribute('inert');page.setAttribute('aria-hidden','false');requestAnimationFrame(()=>requestAnimationFrame(()=>page.classList.add('visible')));intro.classList.add('open');document.body.style.overflow='auto';setTimeout(type,reduced?0:1700)});
letter.addEventListener('click',()=>{const open=letter.classList.toggle('open');letter.setAttribute('aria-expanded',open);letter.setAttribute('aria-label',open?'إغلاق الرسالة':'افتحي الرسالة');if(open){const r=letter.getBoundingClientRect();hearts(r.left+r.width/2,r.top+r.height/2,25)}});heartButton.addEventListener('click',e=>{const r=e.currentTarget.getBoundingClientRect();hearts(r.left+r.width/2,r.top+r.height/2,42)});
const birth=new Date(2009,8,24);function age(){const now=new Date();let y=now.getFullYear()-birth.getFullYear(),m=now.getMonth()-birth.getMonth();if(now.getDate()<birth.getDate())m--;if(m<0){y--;m+=12}const anchor=new Date(birth);anchor.setFullYear(birth.getFullYear()+y);anchor.setMonth(birth.getMonth()+m);let ms=now-anchor,d=Math.floor(ms/864e5);ms-=d*864e5;const h=Math.floor(ms/36e5);ms-=h*36e5;const min=Math.floor(ms/6e4);years.textContent=y;months.textContent=m;days.textContent=d;hours.textContent=h;minutes.textContent=min}age();setInterval(age,30000);
const canvas=document.querySelector('#particles'),ctx=canvas.getContext('2d');let ps=[];function resize(){const d=Math.min(devicePixelRatio||1,2);canvas.width=innerWidth*d;canvas.height=innerHeight*d;canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';ctx.setTransform(d,0,0,d,0,0)}function make(initial=false){return{x:Math.random()*innerWidth,y:initial?Math.random()*innerHeight:innerHeight+20,s:6+Math.random()*10,v:.18+Math.random()*.45,dx:(Math.random()-.5)*.3,a:.18+Math.random()*.42,heart:Math.random()>.46,p:Math.random()*6.28}}function drawHeart(x,y,s){ctx.beginPath();ctx.moveTo(x,y+s*.3);ctx.bezierCurveTo(x-s,y-s*.35,x-s*.55,y-s,x,y-s*.35);ctx.bezierCurveTo(x+s*.55,y-s,x+s,y-s*.35,x,y+s*.3);ctx.fill()}function animate(){ctx.clearRect(0,0,innerWidth,innerHeight);for(const p of ps){p.y-=p.v;p.x+=p.dx+Math.sin(p.y*.012+p.p)*.16;if(p.y<-25)Object.assign(p,make());ctx.globalAlpha=p.a;ctx.fillStyle=p.heart?'#ff9bc5':'#ffe5f1';if(p.heart)drawHeart(p.x,p.y,p.s);else{ctx.save();ctx.translate(p.x,p.y);ctx.rotate(Math.PI/4);ctx.fillRect(-p.s/4,-p.s/4,p.s/2,p.s/2);ctx.restore()}}ctx.globalAlpha=1;if(!reduced)requestAnimationFrame(animate)}resize();ps=Array.from({length:Math.min(55,Math.floor(innerWidth/10))},()=>make(true));animate();addEventListener('resize',resize);
</script></body></html>
